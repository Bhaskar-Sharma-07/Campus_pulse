    class SoundFX {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      }
      playChime(type = 'success') {
        if (this.muted) return;
        try {
          this.init();
          if (!this.ctx) return;
          if (this.ctx.state === 'suspended') this.ctx.resume();

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);

          if (type === 'parse') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(520, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
          } else if (type === 'complete') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.setValueAtTime(660, now + 0.08);
            osc.frequency.setValueAtTime(880, now + 0.16);
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            osc.start(now);
            osc.stop(now + 0.35);
          } else if (type === 'pop') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(350, now);
            osc.frequency.exponentialRampToValueAtTime(550, now + 0.08);
            gain.gain.setValueAtTime(0.05, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            osc.start(now);
            osc.stop(now + 0.12);
          }
        } catch(e) {
          // Audio autoplay block catch
        }
      }

    // --- AI Parsing Logic (Comprehensive NLP & Heuristics) ---
    function parseNoticeWithAI(rawText) {
      const lower = rawText.toLowerCase();
      
      // 1. Detect Category
      let category = 'General';
      if (/exam|viva|quiz|syllabus|lecture|class|assignment|supplementary|mid-term|end-term|academic|prof\b|hod\b/.test(lower)) {
        category = 'Academic';
      }
      if (/deadline|due date|closing|submission|submit by|last date|portal closes|sharp\b|tonight\b/.test(lower)) {
        category = 'Deadline';
      }
      if (/hackathon|fest|cultural|workshop|webinar|symposium|conference|championship|tournament|sports/.test(lower)) {
        category = 'Event';
      }
      if (/club|audition|society|recruitment|gdsc|ieee|awaaz|rotaract|monologue|choir|dance/.test(lower)) {
        category = 'Club';
      }

      // 2. Detect Urgency
      let urgency = 'Low';
      if (/urgent|critical|strict|warning|immediate|tonight|today|mandatory|penalty|defaulters|crucial|sharp\b/.test(lower)) {
        urgency = 'Urgent';
      } else if (/tomorrow|soon|prize pool|extended|fee|important|register by/.test(lower)) {
        urgency = 'Medium';
      }

      // 3. Extract Time
      let time = '11:59 PM';
      const timeMatch = rawText.match(/(\b\d{1,2}(?::\d{2})?\s*(?:AM|PM|am|pm)\b|\b\d{1,2}:\d{2}\b)/);
      if (timeMatch) {
        time = timeMatch[0].toUpperCase();
      }

      // 4. Extract Date relative to Reference Date (Today = Oct 31, 2026)
      const baseDate = new Date(2026, 9, 31); // 2026-10-31
      let parsedDate = '2026-10-31';

      if (lower.includes('tonight') || lower.includes('today')) {
        parsedDate = '2026-10-31';
      } else if (lower.includes('tomorrow')) {
        parsedDate = '2026-11-01';
      } else if (lower.includes('monday')) {
        parsedDate = '2026-11-02';
      } else if (lower.includes('friday')) {
        parsedDate = '2026-11-06';
      } else {
        // Look for e.g. "5th Nov", "November 5", "10th Nov", "Nov 10", "10/11/2026"
        const monthMap = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
        const dayMonthMatch = rawText.match(/(\d{1,2})(?:st|nd|rd|th)?\s+(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)(?:\s*,?\s*(\d{4}))?/i) ||
                              rawText.match(/(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\s+(\d{1,2})(?:st|nd|rd|th)?(?:\s*,?\s*(\d{4}))?/i);
        
        if (dayMonthMatch) {
          let day, monthStr, year = '2026';
          if (isNaN(parseInt(dayMonthMatch[1]))) {
            monthStr = dayMonthMatch[1].substring(0, 3).toLowerCase();
            day = dayMonthMatch[2];
            if (dayMonthMatch[3]) year = dayMonthMatch[3];
          } else {
            day = dayMonthMatch[1];
            monthStr = dayMonthMatch[2].substring(0, 3).toLowerCase();
            if (dayMonthMatch[3]) year = dayMonthMatch[3];
          }
          const monthNum = (monthMap[monthStr] !== undefined ? monthMap[monthStr] + 1 : 11).toString().padStart(2, '0');
          parsedDate = `${year}-${monthNum}-${day.padStart(2, '0')}`;
        }
      }

      // 5. Extract Venue
      let venue = 'Campus Main / Online';
      const venuePatterns = [
        /(?:venue|location|at|in)\s*[:\-]?\s*([A-Za-z0-9\s&()\/'-]{4,35}?)(?=\n|\.|\,|$|time|date|timing)/i,
        /(seminar hall\s*\d*|auditorium\s*[A-Za-z0-9-]*|lab\s*\d+(?:\s*&\s*\d+)?|open air theatre|oat|classroom|sbi collect|accounts section|audi-a|audi-b)/i
      ];
      for (const pattern of venuePatterns) {
        const match = rawText.match(pattern);
        if (match && match[1]) {
          venue = match[1].trim().replace(/^[:\-\s]+/, '');
          break;
        }
      }

      // 6. Extract Contact
      let contact = '';
      const contactMatch = rawText.match(/(?:contact|queries|convenor|prof|hod|officer)[:\s\-]*([A-Za-z0-9\s.()+]{5,35})/i);
      if (contactMatch) {
        contact = contactMatch[1].trim().split('\n')[0];
      }

      // 7. Synthesize Title
      let title = 'Campus Notice';
      const firstLine = rawText.split('\n')[0].replace(/[*#_~🚨⚠️🎉💻🏆🎭💳]/g, '').trim();
      if (firstLine.length > 5 && firstLine.length < 65) {
        title = firstLine.replace(/^(attention|critical|important notice|hey everyone|notice regarding)\s*[:\-]?\s*/i, '').trim();
        if (title.length < 4) title = 'Important Campus Update';
      } else {
        if (category === 'Deadline') title = 'Urgent Assignment / Project Deadline';
        else if (category === 'Event') title = 'Campus Hackathon / Tech Event';
        else if (category === 'Academic') title = 'Academic Schedule & Examination Notice';
        else if (category === 'Club') title = 'Club Activity & Audition Notice';
        else title = 'Official University Announcement';
      }
      // Capitalize nicely
      title = title.charAt(0).toUpperCase() + title.slice(1);

      // 8. Action Items
      const actionItems = [];
      const lines = rawText.split('\n');
      for (const line of lines) {
        const clean = line.replace(/[*#_~•\-]/g, '').trim();
        if (/must|bring|submit|register|upload|prepare|pay|verify|check-in/i.test(clean) && clean.length > 10 && clean.length < 80) {
          actionItems.push(clean);
          if (actionItems.length >= 3) break;
        }
      }
      if (actionItems.length === 0) {
        actionItems.push('Review notice details carefully', 'Mark in personal calendar');
      }

      // 9. Short Summary
      const summary = rawText
        .replace(/[*#_~🚨⚠️🎉💻🏆🎭💳]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .slice(0, 160) + '...';

      return {
        title,
        date: parsedDate,
        time,
        venue,
        category,
        urgency,
        summary,
        actionItems,
        contact: contact || 'Campus Administration'
      };
    }

    // --- Helper: Format human date ---
    function formatHumanDate(dateStr) {
      if (!dateStr) return '';
      try {
        const [y, m, d] = dateStr.split('-').map(Number);
        const dt = new Date(y, m - 1, d);
        return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
      } catch(e) {
        return dateStr;
      }
    }

    // --- Helper: Get Notice Timeline Status ---
    function getNoticeStatus(dateStr) {
      const today = '2026-10-31';
      if (dateStr === today) return { type: 'today', label: 'Due Today', color: 'rose' };
      if (dateStr < today) return { type: 'expired', label: 'Expired', color: 'slate' };
      
      const [y1, m1, d1] = today.split('-').map(Number);
      const [y2, m2, d2] = dateStr.split('-').map(Number);
      const diffDays = Math.round((new Date(y2, m2 - 1, d2) - new Date(y1, m1 - 1, d1)) / (1000 * 60 * 60 * 24));
      
      if (diffDays === 1) return { type: 'tomorrow', label: 'Tomorrow', color: 'amber' };
      if (diffDays <= 7) return { type: 'upcoming', label: `In ${diffDays} days`, color: 'cyan' };
      return { type: 'future', label: `In ${diffDays} days`, color: 'emerald' };
    }

                      className="mt-4 px-4 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 transition-colors cursor-pointer"
                    >
                      Clear Filters
                    </button>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 sm:gap-6">
                    {filteredNotices.map((notice) => {
                      const catStyle = getCategoryStyles(notice.category);
                      const status = getNoticeStatus(notice.date);
                      const isExpanded = expandedOriginalId === notice.id;

                      return (
                        <div
                          key={notice.id}
                          className={`glass-card glass-card-hover rounded-xl p-5 sm:p-6 flex flex-col justify-between transition-all duration-300 ${
                            notice.completed ? 'opacity-50' : ''
                          } ${status.type === 'today' && !notice.completed ? 'border-l-4 border-l-indigo-500' : ''}`}
                        >
                          {/* Top Row: Category & Status */}
                          <div>
                            <div className="flex items-center justify-between gap-2 mb-3">
                              <span className="px-2 py-0.5 rounded-md text-[11px] font-medium text-indigo-300 bg-indigo-500/10">
                                {notice.category}
                              </span>

                              <div className="flex items-center gap-1.5">
                                {notice.urgency === 'Urgent' && (
                                  <span className="px-2 py-0.5 rounded-md text-[10px] font-semibold bg-red-500/15 text-red-300">
                                    Urgent
                                  </span>
                                )}
                                <span className={`px-2 py-0.5 rounded-md text-[10px] font-medium ${
                                  status.type === 'today'
                                    ? 'bg-indigo-500/15 text-indigo-300 font-semibold'
                                    : status.type === 'tomorrow'
                                    ? 'bg-amber-500/10 text-amber-300'
                                    : status.type === 'expired'
                                    ? 'text-slate-500'
                                    : 'text-slate-400'
                                }`}>
                                  {status.label}
                                </span>
                              </div>
                            </div>

                            {/* Title */}
                            <h3 className={`text-[15px] font-semibold text-white mb-2.5 leading-snug ${notice.completed ? 'line-through text-slate-500' : ''}`}>
                              {notice.title}
                            </h3>

                            {/* Date, Time, Venue */}
                            <div className="space-y-1 mb-4 text-xs">
                              <div className="flex items-center gap-2 text-slate-300">
                                <Icon name="calendar" className="w-3.5 h-3.5 text-indigo-400 shrink-0" />
                                <span>{formatHumanDate(notice.date)}</span>
                                <span className="text-slate-600">·</span>
                                <Icon name="clock" className="w-3.5 h-3.5 text-indigo-400 shrink-0" />
                                <span>{notice.time}</span>
                              </div>
                              <div className="flex items-center gap-2 text-slate-400">
                                <Icon name="mapPin" className="w-3.5 h-3.5 text-indigo-400 shrink-0" />
                                <span className="truncate">{notice.venue}</span>
                              </div>
                            </div>

                            {/* Summary */}
                            <p className="text-xs text-slate-400 line-clamp-2 leading-relaxed mb-4">
                              {notice.summary}
                            </p>

                            {/* Action Items */}
                            {notice.actionItems && notice.actionItems.length > 0 && (
                              <div className="mb-4 bg-slate-900/40 p-2.5 rounded-lg text-[11px] space-y-1">
                                {notice.actionItems.map((act, i) => (
                                  <div key={i} className="flex items-start gap-1.5 text-slate-400">
                                    <Icon name="check" className="w-3 h-3 text-indigo-400 mt-0.5 shrink-0" />
                                    <span className="line-clamp-1">{act}</span>
                                  </div>
                                ))}
                              </div>
                            )}

                            {/* Original Text Toggle */}
                            <div className="mb-3">
                              <button
                                onClick={() => setExpandedOriginalId(isExpanded ? null : notice.id)}
                                className="text-[11px] text-slate-500 hover:text-indigo-300 flex items-center gap-1 transition-colors cursor-pointer"
                              >
                                <span>{isExpanded ? 'Hide original' : 'Show original message'}</span>
                                <Icon name={isExpanded ? "chevronDown" : "chevronRight"} className="w-3 h-3" />
                              </button>

                              {isExpanded && (
                                <div className="mt-2 p-3 rounded-lg bg-slate-950/60 border border-slate-800/60 text-[11px] text-slate-400 font-mono whitespace-pre-wrap max-h-36 overflow-y-auto">
                                  {notice.originalText}
                                </div>
                              )}
                            </div>
                          </div>

                          {/* Card Footer */}
                          <div className="pt-3 border-t border-slate-800/50 flex items-center justify-between text-slate-500">
                            <button
                              onClick={() => handleToggleComplete(notice.id)}
                              className={`flex items-center gap-1.5 px-2 py-1 rounded-md text-xs font-medium transition-all cursor-pointer ${
                                notice.completed
                                  ? 'text-indigo-300 bg-indigo-500/10'
                                  : 'hover:bg-slate-800/60 text-slate-400'
                              }`}
                            >
                              <Icon name={notice.completed ? "checkCircle" : "check"} className="w-3.5 h-3.5" />
                              <span>{notice.completed ? 'Done' : 'Mark done'}</span>
                            </button>

                            <div className="flex items-center gap-0.5">
                              <button onClick={() => handleDownloadICS(notice)} className="p-1.5 rounded-md hover:bg-slate-800/60 hover:text-indigo-300 transition-colors cursor-pointer" title="Export .ics">
                                <Icon name="calendar" className="w-3.5 h-3.5" />
                              </button>
                              <button onClick={() => handleCopySummary(notice)} className="p-1.5 rounded-md hover:bg-slate-800/60 hover:text-indigo-300 transition-colors cursor-pointer" title="Copy summary">
                                <Icon name="copy" className="w-3.5 h-3.5" />
                              </button>
                              <button onClick={() => handleDeleteNotice(notice.id)} className="p-1.5 rounded-md hover:bg-red-500/10 hover:text-red-400 transition-colors cursor-pointer" title="Delete">
                                <Icon name="trash" className="w-3.5 h-3.5" />
                              </button>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </section>
            ) : (
              /* --- INTERACTIVE CALENDAR VIEW --- */
              <section className="glass-card rounded-2xl p-5 sm:p-6 border border-slate-800 shadow-2xl">
                
                {/* Calendar Header */}
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-5 border-b border-slate-800">
                  <div className="flex items-center gap-3">
                    <div className="p-2 rounded-xl bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
                      <Icon name="calendar" className="w-5 h-5" />
                    </div>
                    <div>
                      <h3 className="text-base sm:text-lg font-bold text-white">
                        Campus Events & Deadline Calendar
                      </h3>
                      <p className="text-xs text-slate-400">
                        Visual month grid: Click any date to view all notices scheduled for that day.
                      </p>
                    </div>
                  </div>

                  <div className="flex items-center gap-3">
                    <span className="text-xs font-semibold px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-cyan-300">
                      November 2026
                    </span>
                    <div className="flex items-center gap-2 text-xs text-slate-400">
                      <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-rose-500"></span> Urgent</span>
                      <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-purple-500"></span> Event</span>
                      <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-cyan-500"></span> Academic</span>
                    </div>
                  </div>
                </div>

                {/* Day of Week Headers */}
                <div className="grid grid-cols-7 gap-1.5 sm:gap-2 text-center text-xs font-bold text-slate-400 mt-4 mb-2">
                  <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
                </div>

                {/* Calendar Days Grid */}
                <div className="grid grid-cols-7 gap-1.5 sm:gap-2.5">
                  {calendarDays.map((day, idx) => {
                    const isSelected = selectedCalendarDate === day.dateStr;
                    const hasNotices = day.notices.length > 0;

                    return (
                      <div
                        key={idx}
                        onClick={() => {
                          setSelectedCalendarDate(day.dateStr);
                          sound.playChime('pop');
                        }}
                        className={`min-h-[78px] sm:min-h-[96px] p-2 rounded-xl border transition-all cursor-pointer flex flex-col justify-between ${
                          isSelected
                            ? 'bg-slate-800/90 border-cyan-400 shadow-lg shadow-cyan-500/20'
                            : day.isToday
                            ? 'bg-rose-950/30 border-rose-500/60'
                            : day.isCurrentMonth
                            ? 'bg-slate-900/60 border-slate-800 hover:border-slate-700 hover:bg-slate-800/50'
                            : 'bg-slate-950/40 border-slate-900 opacity-40'
                        }`}
                      >
                        <div className="flex items-center justify-between">
                          <span className={`text-xs font-bold ${
                            day.isToday
                              ? 'text-rose-400 font-extrabold'
                              : isSelected
                              ? 'text-cyan-300 font-extrabold'
                              : day.isCurrentMonth
                              ? 'text-slate-200'
                              : 'text-slate-600'
                          }`}>
                            {day.dayNum}
                          </span>

                          {day.isToday && (
                            <span className="text-[9px] font-extrabold px-1 rounded bg-rose-500 text-white">
                              TODAY
                            </span>
                          )}
                        </div>

                        {/* Notice Dots / Micro chips */}
                        <div className="space-y-1 mt-1">
                          {day.notices.slice(0, 2).map((n) => {
                            const isUrgent = n.urgency === 'Urgent';
                            return (
                              <div
                                key={n.id}
                                className={`text-[10px] font-medium px-1.5 py-0.5 rounded truncate ${
                                  isUrgent
                                    ? 'bg-rose-500/30 text-rose-200 border border-rose-500/40'
                                    : n.category === 'Event'
                                    ? 'bg-purple-500/20 text-purple-300'
                                    : 'bg-cyan-500/20 text-cyan-300'
                                }`}
                                title={n.title}
                              >
                                {n.title}
                              </div>
                            );
                          })}
                          {day.notices.length > 2 && (
                            <span className="text-[9px] text-slate-400 font-bold block">
                              +{day.notices.length - 2} more
                            </span>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* Selected Day Agenda Drawer Below Calendar */}
                <div className="mt-6 pt-5 border-t border-slate-800">
                  <div className="flex items-center justify-between mb-3">
                    <h4 className="text-sm font-bold text-white flex items-center gap-2">
                      <Icon name="clock" className="w-4 h-4 text-cyan-400" />
                      <span>Agenda for {formatHumanDate(selectedCalendarDate)}</span>
                    </h4>
                    <span className="text-xs text-slate-400">
                      {notices.filter(n => n.date === selectedCalendarDate).length} event(s) scheduled
                    </span>
                  </div>

                  <div className="space-y-2.5">
                    {notices.filter(n => n.date === selectedCalendarDate).length === 0 ? (
                      <div className="p-4 rounded-xl bg-slate-900/50 border border-slate-800 text-xs text-slate-400 text-center">
                        No college notices or deadlines scheduled for this day. Free schedule!
                      </div>
                    ) : (
                      notices.filter(n => n.date === selectedCalendarDate).map((n) => (
                        <div
                          key={n.id}
                          className="p-3.5 rounded-xl bg-slate-900/90 border border-slate-700/60 flex items-center justify-between gap-3"
                        >
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="text-xs font-bold text-white">{n.title}</span>
                              <span className="text-[10px] px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-300">
                                {n.category}
                              </span>
                            </div>
                            <p className="text-xs text-slate-400 mt-0.5">
                              ⏰ {n.time} • 📍 {n.venue}
                            </p>
                          </div>

                          <div className="flex items-center gap-2">
                            <button
                              onClick={() => handleDownloadICS(n)}
                              className="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 border border-slate-700 flex items-center gap-1 cursor-pointer"
                            >
                              <Icon name="download" className="w-3 h-3" />
                              <span>.ICS</span>
                            </button>
                            <button
                              onClick={() => handleCopySummary(n)}
                              className="p-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 cursor-pointer"
                            >
                              <Icon name="copy" className="w-3.5 h-3.5" />
                            </button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </section>
            )}

          </main>

          {/* MODAL: Weekly Executive AI Summary Digest ("What do I need to know this week?") */}
          {showDigestModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fadeIn">
              <div className="glass-modal max-w-2xl w-full rounded-2xl p-6 sm:p-7 border border-indigo-500/40 relative shadow-2xl max-h-[90vh] overflow-y-auto">
                
                {/* Modal Header */}
                <div className="flex items-center justify-between pb-4 border-b border-slate-800">
                  <div className="flex items-center gap-3">
                    <div className="p-2 rounded-xl bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">
                      <Icon name="sparkles" className="w-6 h-6 text-amber-300" />
                    </div>
                    <div>
                      <h3 className="text-lg font-bold text-white flex items-center gap-2">
                        Weekly Executive Digest
                        <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                          Oct 31 – Nov 7, 2026
                        </span>
                      </h3>
                      <p className="text-xs text-slate-400">
                        AI consolidated summary of all verified notices across college WhatsApp groups.
                      </p>
                    </div>
                  </div>

                  <button
                    onClick={() => setShowDigestModal(false)}
                    className="p-1.5 rounded-lg bg-slate-800/80 text-slate-400 hover:text-white"
                  >
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                {/* Briefing Stats Bar */}
                <div className="grid grid-cols-3 gap-3 my-5">
                  <div className="p-3 rounded-xl bg-slate-900/80 border border-slate-800 text-center">
                    <span className="text-xl font-black text-rose-400">{weeklyDigest.urgentCount}</span>
                    <span className="text-[11px] block text-slate-400 font-medium">Critical Deadlines</span>
                  </div>
                  <div className="p-3 rounded-xl bg-slate-900/80 border border-slate-800 text-center">
                    <span className="text-xl font-black text-purple-400">{weeklyDigest.eventItems.length}</span>
                    <span className="text-[11px] block text-slate-400 font-medium">Events & Clubs</span>
                  </div>
                  <div className="p-3 rounded-xl bg-slate-900/80 border border-slate-800 text-center">
                    <span className="text-xl font-black text-cyan-400">{weeklyDigest.totalActive}</span>
                    <span className="text-[11px] block text-slate-400 font-medium">Total Active Notices</span>
                  </div>
                </div>

                {/* Briefing Sections */}
                <div className="space-y-4 text-xs sm:text-sm">
                  
                  {/* Critical Action Needed */}
                  <div className="p-4 rounded-xl bg-rose-950/20 border border-rose-500/30 space-y-2">
                    <h4 className="text-xs font-bold text-rose-300 uppercase tracking-wider flex items-center gap-1.5">
                      <Icon name="flame" className="w-4 h-4 text-rose-400" />
                      <span>Immediate Action Required (Next 48 Hours)</span>
                    </h4>
                    {weeklyDigest.urgentItems.length === 0 ? (
                      <p className="text-xs text-slate-400">No urgent flags pending!</p>
                    ) : (
                      weeklyDigest.urgentItems.map(item => (
                        <div key={item.id} className="flex items-start justify-between gap-2 border-b border-rose-500/10 pb-2 last:border-0 last:pb-0">
                          <div>
                            <strong className="text-white block font-semibold">{item.title}</strong>
                            <span className="text-xs text-slate-300">
                              Due: {formatHumanDate(item.date)} at {item.time} ({item.venue})
                            </span>
                          </div>
                          <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-rose-500/30 text-rose-200 shrink-0">
                            URGENT
                          </span>
                        </div>
                      ))
                    )}
                  </div>

                  {/* Academic & Exams */}
                  <div className="p-4 rounded-xl bg-cyan-950/20 border border-cyan-500/30 space-y-2">
                    <h4 className="text-xs font-bold text-cyan-300 uppercase tracking-wider flex items-center gap-1.5">
                      <Icon name="bookOpen" className="w-4 h-4 text-cyan-400" />
                      <span>Academic & Examinations This Week</span>
                    </h4>
                    {weeklyDigest.academicItems.map(item => (
                      <div key={item.id} className="flex items-start justify-between gap-2">
                        <div>
                          <strong className="text-slate-100 block font-semibold">{item.title}</strong>
                          <span className="text-xs text-slate-400">{formatHumanDate(item.date)} • {item.venue}</span>
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* Opportunities & Festivities */}
                  <div className="p-4 rounded-xl bg-purple-950/20 border border-purple-500/30 space-y-2">
                    <h4 className="text-xs font-bold text-purple-300 uppercase tracking-wider flex items-center gap-1.5">
                      <Icon name="sparkles" className="w-4 h-4 text-purple-400" />
                      <span>Major Campus Opportunities & Clubs</span>
                    </h4>
                    {weeklyDigest.eventItems.map(item => (
                      <div key={item.id} className="flex items-start justify-between gap-2">
                        <div>
                          <strong className="text-slate-100 block font-semibold">{item.title}</strong>
                          <span className="text-xs text-slate-400">{formatHumanDate(item.date)} at {item.time} • {item.venue}</span>
                        </div>
                      </div>
                    ))}
                  </div>

                </div>

                {/* Modal Footer */}
                <div className="mt-6 pt-4 border-t border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <p className="text-[11px] text-slate-400">
                    💡 Perfect format to forward directly back into class WhatsApp groups.
                  </p>

                  <div className="flex items-center gap-2">
                    <button
                      onClick={handleCopyWeeklyDigest}
                      className="w-full sm:w-auto px-4 py-2 rounded-xl bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white text-xs font-bold shadow-lg shadow-indigo-500/30 flex items-center justify-center gap-2 cursor-pointer transition-all active:scale-95"
                    >
                      <Icon name={digestCopied ? "check" : "copy"} className="w-4 h-4" />
                      <span>{digestCopied ? 'Copied to Clipboard!' : 'Copy WhatsApp Digest'}</span>
                    </button>
                  </div>
                </div>

              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="mt-auto border-t border-slate-800/80 py-6 text-center text-xs text-slate-500">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-2">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span className="font-medium text-slate-400">Campus Pulse • College Hackathon Edition</span>
              </div>
              <p>
                Eliminating notice fatigue from WhatsApp spam & unorganized student chats.
              </p>
              <div className="flex items-center gap-4 text-slate-400">
                <button onClick={handleResetDemoData} className="hover:text-cyan-300 transition-colors cursor-pointer">
                  Reset Data
                </button>
                <span>•</span>
                <span>Persistent LocalStorage</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CampusPulseApp />);
  </script>
</body>
</html>
